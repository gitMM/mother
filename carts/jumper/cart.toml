[cart]
id = "jumper"
title = "JUMPER"
family = "platform"

[env]
gravity = "down"
surface = "ground"
scroll = "follow"
avatar = "lr"
spawn = "world"
deploy = true
bounds = { left = "solid", right = "solid", top = "solid", bottom = "kill" }

# Touch the flagpole at column 192.
[objective]
type = "escape"
exit = { x = 1538, y = 64, w = 4, h = 88 }

[avatar]
